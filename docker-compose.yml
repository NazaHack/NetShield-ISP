# =============================================================================
#  NetShield-ISP — Multi-tenant network audit & port scanning platform
#  Local / staging orchestration stack.
#
#  Services:
#    db            PostgreSQL 16  (persistent volume, tenant-scoped schema)
#    redis         Redis 7        (Celery broker + result backend, AOF enabled)
#    backend       FastAPI        (REST API, :8000)
#    celery_worker Celery worker  (Nmap-enabled scan executor)
#    frontend      Next.js        (dashboard UI, :3000)
#
#  Security notes:
#    * Datastores bind to the loopback interface only; never expose them to 0.0.0.0.
#    * Only `celery_worker` receives NET_RAW — the privilege Nmap needs for
#      SYN/OS-detection scans. The API container is deliberately capability-less.
#    * Every container drops every Linux capability except `db`, whose entrypoint
#      needs CHOWN/SETUID/SETGID to initialise its data directory, and
#      `celery_worker`, which keeps NET_RAW for scanning.
#    * Every container sets `no-new-privileges` except `celery_worker`; see the
#      explanation on that service for why the flag would break scanning there.
# =============================================================================

name: netshield-isp

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-netshield}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-netshield}

# Shared application environment. Consumed by `backend` and `celery_worker`
# so both halves of the platform always agree on tenancy and crypto settings.
x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-netshield}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-netshield}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_BROKER_DB: ${REDIS_BROKER_DB:-0}
  REDIS_RESULT_DB: ${REDIS_RESULT_DB:-1}
  REDIS_RATELIMIT_DB: ${REDIS_RATELIMIT_DB:-2}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
  LOGIN_ATTEMPT_WINDOW_SECONDS: ${LOGIN_ATTEMPT_WINDOW_SECONDS:-900}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  NMAP_BINARY_PATH: ${NMAP_BINARY_PATH:-/usr/bin/nmap}
  NMAP_MAX_TARGETS_PER_SCAN: ${NMAP_MAX_TARGETS_PER_SCAN:-4096}
  NMAP_SCAN_TIMEOUT_SECONDS: ${NMAP_SCAN_TIMEOUT_SECONDS:-3600}
  SCAN_ALLOW_PRIVATE_RANGES: ${SCAN_ALLOW_PRIVATE_RANGES:-true}
  SCAN_DENYLIST_CIDRS: ${SCAN_DENYLIST_CIDRS:-169.254.0.0/16,127.0.0.0/8}
  MAX_CONCURRENT_SCANS_PER_TENANT: ${MAX_CONCURRENT_SCANS_PER_TENANT:-3}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — system of record. All business tables are tenant-scoped.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: netshield_db
    restart: unless-stopped
    environment:
      <<: *postgres-env
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable from the host for psql/DBeaver, never from the LAN.
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netshield} -d ${POSTGRES_DB:-netshield}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - netshield_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis 7 — Celery broker (db 0) and result backend (db 1).
  # AOF persistence keeps queued scans across restarts.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: netshield_redis
    restart: unless-stopped
    # Start as the unprivileged `redis` user directly. The image entrypoint would
    # otherwise begin as root and call `setpriv` to drop privileges, which needs
    # CAP_SETUID/CAP_SETGID and so fails under `cap_drop: ALL`. Starting
    # unprivileged removes the need for those capabilities entirely.
    user: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - netshield_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # FastAPI — REST API. Holds no scanning privileges by design: it only
  # validates, authorises and enqueues work onto Redis.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BACKEND_BUILD_TARGET:-development}
    container_name: netshield_backend
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: netshield-api
      UVICORN_RELOAD: ${UVICORN_RELOAD:-true}
    volumes:
      # Bind-mount for hot reload in development. Remove for production images.
      # The virtualenv lives at /opt/venv, outside this mount, so dependency
      # changes take effect on rebuild without any volume juggling.
      #
      # `z` requests a shared SELinux relabel of the source tree. It is required
      # on SELinux hosts such as Fedora and RHEL, where an unlabelled bind mount
      # is invisible to the container, and is ignored everywhere else. The label
      # is shared rather than private (`Z`) because the worker mounts the same
      # directory.
      - ./backend:/app:rw,z
    ports:
      - "${BACKEND_HOST_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - netshield_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Celery worker — the only container with Nmap installed and with the raw
  # socket capabilities required for SYN scanning and OS fingerprinting.
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      target: ${WORKER_BUILD_TARGET:-development}
    container_name: netshield_celery_worker
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: netshield-worker
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
      CELERY_QUEUES: ${CELERY_QUEUES:-scans,default}
    volumes:
      # See the backend service for why the `z` relabel is present.
      - ./backend:/app:rw,z
      - scan_artifacts:/var/lib/netshield/scans
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL because the node name has to be expanded at runtime, and the
      # worker registers itself as `worker@<hostname>` (see `--hostname` below).
      test:
        - CMD-SHELL
        - >-
          celery -A app.workers.celery_app:celery_app inspect ping
          -d worker@$$(hostname) --timeout 10
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s
    # Nmap needs raw packet access for -sS / -O / -sU, and NET_BIND_SERVICE for
    # low source ports such as `--source-port 53`. Everything else is dropped.
    # CAP_NET_ADMIN is not granted: no scan type needs it, and a capability no
    # process can use is only attack surface.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE
    # `no-new-privileges` is deliberately absent HERE and only here.
    #
    # The kernel refuses to let execve grant privileges the caller did not
    # already hold, so with NoNewPrivs set it silently discards a binary's file
    # capabilities. Since this container runs as an unprivileged user and gets
    # raw sockets solely through the file capabilities on Nmap, enabling the
    # flag would make every SYN scan fail with a permission error.
    #
    # The worker's `netshield.system.health_check` task reports all three
    # factors (bounding set, file capabilities, NoNewPrivs) so that a wrong
    # combination surfaces as an unhealthy worker instead of silent failures.
    networks:
      - netshield_net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Next.js dashboard.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-development}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NetShield-ISP}
    container_name: netshield_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Browser-side calls go through the host-published API port.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NetShield-ISP}
      # Server-side (RSC / route handlers) calls stay inside the compose network.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app:rw,z
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "${FRONTEND_HOST_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - netshield_net
    logging: *default-logging

volumes:
  postgres_data:
    name: netshield_postgres_data
  redis_data:
    name: netshield_redis_data
  scan_artifacts:
    name: netshield_scan_artifacts
  frontend_node_modules:
    name: netshield_frontend_node_modules
  frontend_next_cache:
    name: netshield_frontend_next_cache

networks:
  netshield_net:
    name: netshield_net
    driver: bridge
