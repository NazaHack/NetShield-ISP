# =============================================================================
#  NetShield-ISP backend — tooling configuration.
#  Dependencies live in requirements.txt / requirements-dev.txt so that Docker
#  can cache the dependency layer independently of the source tree.
# =============================================================================

[project]
name = "netshield-isp-backend"
version = "0.1.0"
description = "Multi-tenant network audit and port scanning platform for ISPs."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez: no naive datetimes in an audit platform
    "S",    # flake8-bandit: security lint
    "A",    # flake8-builtins
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401", # Any is legitimate in signal handlers and task kwargs
]

[tool.ruff.lint.per-file-ignores]
# Assertions and hard-coded test fixtures are expected in the test suite.
"tests/**/*.py" = ["S101", "S105", "S106", "D103", "ANN201"]
"alembic/env.py" = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The `alembic/` migrations directory shares its name with the library and
# would otherwise be misdetected as a local package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL and Redis instance",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/healthcheck.py", "alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
